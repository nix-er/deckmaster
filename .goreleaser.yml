version: 2

builds:
  - binary: deckmaster
    flags:
      - -trimpath
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}
    # USB access needs cgo, and Go silently disables it when cross compiling
    # unless CC is a cross compiler for the target.
    env:
      - CGO_ENABLED=1
      - >-
        CC={{ if eq .Arch "arm64" }}{{ envOrDefault "CC_ARM64" "aarch64-linux-gnu-gcc" }}
        {{- else if eq .Arch "arm" }}{{ envOrDefault "CC_ARM" "arm-linux-gnueabihf-gcc" }}
        {{- else }}{{ envOrDefault "CC" "gcc" }}{{ end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

nfpms:
  - ids:
      - deckmaster
    vendor: nix-er
    homepage: "https://github.com/nix-er/deckmaster"
    maintainer: "nix-er <nixer@nixer.dev>"
    description: "An application to control your Elgato Stream Deck on Linux"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

